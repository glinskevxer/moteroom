name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m moteroom.tools.check_migrations
      - run: python -m moteroom.tools.check_docstrings
      - run: python -m moteroom.tools.check_layers
      - run: python -m moteroom.tools.check_wiring
      - run: python -m moteroom.tools.check_cli
      - run: python -m moteroom.tools.check_glossary
      - run: python -m moteroom.tools.check_errors
      - run: python -m moteroom.tools.check_tests
      - run: python -m moteroom.tools.check_sql
      - run: python -m moteroom.tools.check_workflow
      - run: python -m moteroom.tools.release_check

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=moteroom --cov-report=term-missing --cov-report=json
      - run: python -m moteroom.tools.check_coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build==1.2.2.post1
      - run: python -m build
      - run: pip install dist/*.whl
      - run: moteroom --version
